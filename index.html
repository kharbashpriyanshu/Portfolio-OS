<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#00ddff" />

    <!-- Premium Cybersecurity Typography (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- SEO Defaults & Canonical Link -->
    <title>Portfolio OS - Priyanshu Kharbash</title>
    <meta
      name="description"
      content="Production-grade personal portfolio architecture engineered by Priyanshu Kharbash with React 19, Vite, TypeScript, and Tailwind CSS."
    />
    <meta name="author" content="Priyanshu Kharbash" />
    <meta
      name="keywords"
      content="Priyanshu Kharbash, Portfolio OS, Cyber Security Engineer, AI Security Developer, Digital Forensics Enthusiast"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_APP_URL%/" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Portfolio OS - Priyanshu Kharbash" />
    <meta
      property="og:description"
      content="Cyber Security Engineer, AI Security Developer, and Digital Forensics Enthusiast portfolio engineered by Priyanshu Kharbash."
    />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:site_name" content="Portfolio OS" />
    <meta property="og:image" content="%VITE_APP_URL%/og-image.webp" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portfolio OS - Priyanshu Kharbash" />
    <meta
      name="twitter:description"
      content="Cyber Security Engineer, AI Security Developer, and Digital Forensics Enthusiast portfolio engineered by Priyanshu Kharbash."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/og-image.webp" />

    <!-- JSON-LD Structured Data for Google Search Indexing -->
    <script id="portfolio-json-ld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Priyanshu Kharbash",
        "url": "%VITE_APP_URL%",
        "description": "Cyber Security Engineer, AI Security Developer, and Digital Forensics Enthusiast portfolio engineered by Priyanshu Kharbash.",
        "jobTitle": "Cyber Security Engineer"
      }
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased selection:bg-primary/10 selection:text-primary">
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
